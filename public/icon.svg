<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#27272a" stroke-width="4"/>

  <!-- Subtle Ember Glow Circle -->
  <circle cx="256" cy="270" r="160" fill="#f97316" opacity="0.12" filter="url(#glow)"/>

  <!-- Outer Crown (Sultan) -->
  <path d="M 176 170 L 206 205 L 256 145 L 306 205 L 336 170 L 330 220 L 182 220 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  <circle cx="176" cy="165" r="7" fill="#fef08a"/>
  <circle cx="256" cy="140" r="9" fill="#fef08a"/>
  <circle cx="336" cy="165" r="7" fill="#fef08a"/>

  <!-- Flame Silhouette -->
  <path d="M256 190 C220 250, 180 290, 180 345 C180 395, 214 430, 256 430 C298 430, 332 395, 332 345 C332 290, 292 250, 256 190 Z" fill="url(#flameGrad)" />

  <!-- Inner Fire Hearth -->
  <path d="M256 260 C235 295, 215 325, 215 355 C215 385, 233 410, 256 410 C279 410, 297 385, 297 355 C297 325, 277 295, 256 260 Z" fill="#fef08a" opacity="0.9" />

  <!-- Roaster Skewer / Grill cross accent -->
  <path d="M160 380 L352 380" stroke="#71717a" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
  <path d="M180 395 L332 395" stroke="#71717a" stroke-width="4" stroke-linecap="round" opacity="0.3"/>

  <!-- Text Arc Sultan Ed-Djaj -->
  <text x="256" y="470" text-anchor="middle" fill="#f43f5e" font-family="system-ui, sans-serif" font-weight="900" font-size="28" letter-spacing="4">SULTAN ED-DJAJ</text>
</svg>
